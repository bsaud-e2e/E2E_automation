name: E2E Tests

on:
  push:
    branches: ['**']
  # Runs on every PR targeting main too (open, new commits pushed, or
  # reopened) - `push` alone only fires for direct commits to a branch,
  # never for the PR/merge-request event itself, so opening a PR from an
  # already-pushed branch previously triggered nothing new.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Specs that complete a real Shopify checkout - confirmed these reliably
# redirect to e2-staging-store.myshopify.com from a local/residential IP but
# consistently time out on page.waitForURL from GitHub-hosted runners'
# cloud IPs (see the "payment" job below). Keep this list in sync with
# tests/**/*.spec.ts if a spec starts/stops completing a real payment.
#
# Specs that are expected to currently fail against the live app - either a
# confirmed, reproducible application defect (broken practice/assessment
# launch entry points - see the README's "Known findings") or a flaky
# external dependency (Mailinator email delivery timing for TC-STU-056) -
# run in their own non-blocking job so a real regression elsewhere still
# fails the build, but these known conditions don't.
# TC IDs below follow Stage_TestCase_E2E (final) numbering. Several specs
# were renumbered from an earlier draft sheet when it was finalized:
# TC-STU-065/066 -> 060/061, TC-STU-069 -> 064, TC-STU-072 -> 067,
# TC-STU-075/076 -> 070/071, TC-STU-097/104 -> retired, folded into
# TC-E2E-053 (was TC-E2E-003). Keep these greps in sync with test titles.
env:
  PAYMENT_SPECS_GREP: 'TC-STU-020:|TC-STU-011:|TC-STU-036:|TC-STU-027:|TC-STU-028:|TC-STU-013:'
  KNOWN_ISSUES_SPECS_GREP: 'TC-STU-060 / TC-STU-061:|TC-STU-070 / TC-STU-071:|TC-E2E-053:|TC-STU-056:'

jobs:
  playwright:
    name: Run Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (excluding payment-completing and known-issue specs)
        run: npx playwright test --grep-invert "$PAYMENT_SPECS_GREP|$KNOWN_ISSUES_SPECS_GREP"

      - name: QA Agent - analyze results and report
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/qa-report.js

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces/videos for failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  playwright-payment:
    name: Run payment-completing specs (non-blocking)
    # Runs on a self-hosted runner instead of GitHub's shared ubuntu-latest
    # pool: the Shopify staging checkout redirect these specs depend on is
    # blocked from GitHub-hosted runners' cloud IPs (confirmed working
    # locally / from a residential IP every time - see the README's "Known
    # findings"), most likely by the store's own Cloudflare/WAF flagging
    # GitHub's shared datacenter IP ranges. A self-hosted runner's fixed,
    # non-flagged IP sidesteps that without allowlisting GitHub's entire
    # (~7,000-entry, constantly-changing) Actions IP range.
    #
    # Requires a runner registered against this repo with BOTH labels
    # below (Settings > Actions > Runners > New self-hosted runner) - see
    # the "Self-hosted runner setup" section in the README for the exact
    # steps. continue-on-error stays on: if no such runner is online, this
    # job queues/times out rather than failing the workflow outright.
    runs-on: [self-hosted, e2e-payment]
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run payment-completing E2E specs
        run: npx playwright test --grep "$PAYMENT_SPECS_GREP"

      - name: QA Agent - analyze results and report
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/qa-report.js

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-payment
          path: playwright-report/
          retention-days: 14

      - name: Upload traces/videos for failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-payment
          path: test-results/
          retention-days: 14

  playwright-known-issues:
    name: Run known-issue specs (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # These specs assert the CORRECT/expected app behavior per the Excel
    # test-case sheet, and are known to currently fail - either a confirmed,
    # reproducible application defect (see README "Known findings") or
    # Mailinator email-delivery timing. Kept running (not deleted) so a real
    # regression, or the day the underlying defect is fixed, is still
    # visible - but never blocks the build.
    continue-on-error: true
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run known-issue E2E specs
        run: npx playwright test --grep "$KNOWN_ISSUES_SPECS_GREP"

      - name: QA Agent - analyze results and report
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/qa-report.js

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-known-issues
          path: playwright-report/
          retention-days: 14

      - name: Upload traces/videos for failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-known-issues
          path: test-results/
          retention-days: 14
