name: E2E Tests

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Specs that complete a real Shopify checkout - confirmed these reliably
# redirect to e2-staging-store.myshopify.com from a local/residential IP but
# consistently time out on page.waitForURL from GitHub-hosted runners'
# cloud IPs (see the "payment" job below). Keep this list in sync with
# tests/**/*.spec.ts if a spec starts/stops completing a real payment.
env:
  PAYMENT_SPECS_GREP: 'TC-STU-020:|TC-STU-011:|TC-STU-036:|TC-STU-027:|TC-STU-028:'

jobs:
  playwright:
    name: Run Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (excluding payment-completing specs)
        run: npx playwright test --grep-invert "$PAYMENT_SPECS_GREP"

      - name: QA Agent - analyze results and report
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/qa-report.js

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces/videos for failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  playwright-payment:
    name: Run payment-completing specs (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Known environment limitation, not a pipeline gate: the Shopify staging
    # checkout redirect these specs depend on is unreliable from GitHub's
    # runner IPs (confirmed working locally / from a residential IP every
    # time). This job still runs and reports so a real regression elsewhere
    # in these specs is still visible, but it never fails the workflow.
    continue-on-error: true
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run payment-completing E2E specs
        run: npx playwright test --grep "$PAYMENT_SPECS_GREP"

      - name: QA Agent - analyze results and report
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/qa-report.js

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-payment
          path: playwright-report/
          retention-days: 14

      - name: Upload traces/videos for failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-payment
          path: test-results/
          retention-days: 14
